dataset_id: "land_use"
name: "Land Use Characteristics in NYC (Facilities, Businesses, Sidewalk Context, NYCHA, and Historic Land Use)"
description: >
  This data element consists of five datasets that together capture land use characteristics across New York City.

  The following **three datasets were spatially merged**:
  1) The **Facilities Database** — merged with NYC Planimetric Sidewalk geometries to associate public buildings
     (e.g. schools, libraries, civic centers) with nearby sidewalks.
  2) The **Issued Licenses Database** — also spatially joined to sidewalks to capture the proximity of
     licensed businesses and commercial activity.
  3) The **Sidewalk Geometries** — base polygon dataset representing NYC sidewalks, used as the spatial anchor
     for proximity calculations in the merged output.

  In addition, two datasets were **not merged**, but are included in raw form:
  4) The **NYCHA Residential Addresses** dataset — a listing of New York City Housing Authority properties,
     offering a reference for public housing locations.
  5) The **Historic Land Use Data** — describing historical land uses for vacant or industrial-zoned lots based
     on Sanborn map reviews over the past century.

  This data element supports analysis of land use accessibility, pedestrian adjacency to facilities and businesses,
  housing equity, and historical development trends.

source_organization:
  facilities: "New York City Department of City Planning (DCP)"
  issued_licenses: "New York City Department of Consumer and Worker Protection (DCWP)"
  sidewalks: "New York City Department of Information Technology & Telecommunications (DoITT)"
  nycha: "New York City Housing Authority (NYCHA)"
  historic_land_use: "New York City Department of Environmental Protection (DEP)"

domain: "land_use"
last_updated: "2025-07-25"
update_frequency:

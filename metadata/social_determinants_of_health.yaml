dataset_id: "social_determinants_of_health"
name: "New York City Community Health Survey (CHS)"
description: >
  There was no merging or post processing. The Community Health Survey (CHS) is an annual, population-based telephone survey
  conducted by the NYC Department of Health and Mental Hygiene (DOHMH). It captures
  health behaviors, access to care, chronic conditions, and other indicators that
  relate to social determinants of health across New York City.

  This repository ingests the raw CHS table directly from NYC Open Data with **no additional
  processing**. The download preserves the original columns as published by DOHMH so that
  analysts can filter, aggregate, and join to other geographies as needed.

